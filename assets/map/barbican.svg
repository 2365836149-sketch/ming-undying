  <rect x="8" y="4" width="16" height="24" fill="#8B7B6B" stroke="none"/>
  <!-- 城垛 -->
  <rect x="2" y="2" width="4" height="4" fill="#6B5B4B" stroke="#4A3A2A" stroke-width="0.6"/>
  <rect x="8" y="2" width="4" height="4" fill="#6B5B4B" stroke="#4A3A2A" stroke-width="0.6"/>
